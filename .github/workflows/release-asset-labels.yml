name: Release asset labels
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        default: v1.0.0-rc1
permissions:
  contents: write
jobs:
  label-assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | [.id,.name] | @tsv' | while IFS=$'\t' read -r id name; do
            case "$name" in
              *Manual*) gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f label='うつらうつらとつつうらうらと 한국어 패치 (Manual)' ;;
              *Korean_Patch*) gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f label='うつらうつらとつつうらうらと 한국어 패치 (Auto)' ;;
              *SHA*) gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f label='SHA-256 체크섬' ;;
            esac
          done
